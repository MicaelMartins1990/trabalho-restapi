<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API - Gestão de Alunos</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Gestão de Alunos</h1>

    <div class="caixa">
        <h2>Adicionar / Editar Aluno</h2>
        <form id="formAluno">

            <input type="hidden" id="alunoId">

            <label>Nome: <input type="text" id="nome" required></label>
            <label>Apelido: <input type="text" id="apelido" required></label>
            <label>Curso: <select id="idCurso" required></select></label>
            <label>Ano curricular: <input type="number" id="anoCurricular" min="1" max="5" required></label>

            <button type="submit">Guardar</button>
            <button type="button" id="btnCancelar" style="display:none;">Cancelar Edição</button>
        </form>
    </div>

    <div class="caixa">
        <h2>Lista de Alunos</h2>
        <div id="divalunos"></div>
    </div>

</body>
</html>
